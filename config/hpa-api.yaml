apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arrakis-api
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-api
    app.kubernetes.io/managed-by: arrakis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arrakis-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
