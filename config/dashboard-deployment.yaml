apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrakis-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-dashboard
    app.kubernetes.io/managed-by: arrakis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arrakis-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arrakis-dashboard
    spec:
      containers:
        - name: dashboard
          image: arrakis-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: arrakis-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-dashboard
spec:
  selector:
    app.kubernetes.io/name: arrakis-dashboard
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
