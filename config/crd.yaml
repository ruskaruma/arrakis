apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.arrakis.io
spec:
  group: arrakis.io
  names:
    kind: Store
    listKind: StoreList
    plural: stores
    singular: store
    shortNames:
      - st
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.storeName
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Revision
          type: integer
          jsonPath: .status.helmRevision
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - engine
              properties:
                engine:
                  type: string
                  enum:
                    - woocommerce
                    - medusajs
                  description: The e-commerce engine to provision.
                storeName:
                  type: string
                  maxLength: 64
                  description: Human-readable name for the store.
                template:
                  type: string
                  enum:
                    - general
                    - fashion
                    - food
                    - electronics
                    - beauty
                    - sports
                    - books
                  default: general
                  description: Product template to seed on creation.
                owner:
                  type: string
                  description: GitHub user ID of the store owner.
                version:
                  type: string
                  maxLength: 32
                  description: Desired version for helm upgrade.
                helmValues:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Additional Helm values to set on upgrade.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Configuring
                    - Verifying
                    - Ready
                    - Failed
                    - Deleting
                    - Upgrading
                    - RollingBack
                  description: Current lifecycle phase of the store.
                url:
                  type: string
                  description: The URL where the store is accessible once ready.
                message:
                  type: string
                  description: Human-readable message with details about the current phase or error.
                startedAt:
                  type: string
                  format: date-time
                  description: Timestamp when provisioning started.
                readyAt:
                  type: string
                  format: date-time
                  description: Timestamp when the store became ready.
                observedGeneration:
                  type: integer
                  format: int64
                  description: The generation of the spec last reconciled by the operator.
                retryCount:
                  type: integer
                  description: Number of reconciliation retries before marking as Failed.
                helmRevision:
                  type: integer
                  description: Current Helm release revision number.
                lastUpgradedAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last successful upgrade.
                rollbackRevision:
                  type: integer
                  description: Target revision for rollback. Reconciler clears on pickup.
