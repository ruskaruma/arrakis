apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrakis-api
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-api
    app.kubernetes.io/managed-by: arrakis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arrakis-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arrakis-api
    spec:
      serviceAccountName: arrakis-operator
      containers:
        - name: api
          image: arrakis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: SKIP_AUTH
              value: "false"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: arrakis-api-secrets
                  key: session-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: arrakis-api-secrets
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: arrakis-api-secrets
                  key: github-client-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: arrakis-api
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-api
spec:
  selector:
    app.kubernetes.io/name: arrakis-api
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
