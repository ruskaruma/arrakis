apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrakis-operator
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-operator
    app.kubernetes.io/managed-by: arrakis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arrakis-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arrakis-operator
    spec:
      serviceAccountName: arrakis-operator
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: arrakis-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
