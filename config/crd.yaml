apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.arrakis.io
spec:
  group: arrakis.io
  names:
    kind: Store
    listKind: StoreList
    plural: stores
    singular: store
    shortNames:
      - st
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - engine
              properties:
                engine:
                  type: string
                  enum:
                    - woocommerce
                    - medusajs
                  description: The e-commerce engine to provision.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Configuring
                    - Verifying
                    - Ready
                    - Failed
                    - Deleting
                  description: Current lifecycle phase of the store.
                url:
                  type: string
                  description: The URL where the store is accessible once ready.
                message:
                  type: string
                  description: Human-readable message with details about the current phase or error.
