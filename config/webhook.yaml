apiVersion: v1
kind: Service
metadata:
  name: arrakis-webhook
  namespace: default
  labels:
    app.kubernetes.io/name: arrakis-operator
    app.kubernetes.io/managed-by: arrakis
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    app.kubernetes.io/name: arrakis-operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: arrakis-store-validator
  labels:
    app.kubernetes.io/managed-by: arrakis
  annotations:
    cert-manager.io/inject-ca-from: default/arrakis-webhook-cert
webhooks:
  - name: validate.stores.arrakis.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Exact
    timeoutSeconds: 5
    clientConfig:
      service:
        name: arrakis-webhook
        namespace: default
        path: /validate
        port: 443
    rules:
      - apiGroups: ["arrakis.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["stores"]
        scope: Namespaced
---
